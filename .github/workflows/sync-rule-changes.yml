name: Sync IANA rule changes

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/sync-rule-changes.mjs
      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: sync IANA rule changes from upstream NEWS'
          title: 'chore: sync IANA rule changes from upstream NEWS'
          branch: chore/sync-rule-changes
          delete-branch: true
          labels: timezone-data,automated
          body: |
            Auto-generated by `.github/workflows/sync-rule-changes.yml`.

            Review the diff in `public/rule-changes.json`. If a zone deserves
            a localised message, lift it into `STATIC_RULE_CHANGES` in
            `src/data/ruleChanges.js` with proper i18n keys in
            `src/locales/en.js` + `zh.js`. Otherwise merge as is; the
            dynamic fallback in `getRuleChangeMessage` will surface the
            IANA description prefixed with `policy.fallbackPrefix`.
